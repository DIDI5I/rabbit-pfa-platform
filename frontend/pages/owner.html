<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rabbit — Administrateur</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/chatbot.css">
</head>

<body>
  <div class="dash-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">
          <i class="fas fa-cube" style="color:white"></i>
        </div>
        <div>
          <div class="sidebar-brand-name">Rabbit</div>
          <div class="sidebar-brand-tag">B2B MRO</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Principal</div>

        <a class="sidebar-item active" data-view="dashboard">
          <i class="fas fa-chart-line"></i>
          <span>Tableau de bord</span>
        </a>

        <a class="sidebar-item" data-view="products">
          <i class="fas fa-box"></i>
          <span>Produits</span>
        </a>

        <a class="sidebar-item" data-view="inventory">
          <i class="fas fa-warehouse"></i>
          <span>Inventaire</span>
        </a>

        <a class="sidebar-item" data-view="intelligence">
          <i class="fas fa-brain"></i>
          <span>Intelligence stock</span>
        </a>

        <div class="sidebar-section-label">Approvisionnement</div>

        <a class="sidebar-item" data-view="rfqs">
          <i class="fas fa-file-invoice"></i>
          <span>Demandes de devis</span>
        </a>

        <a class="sidebar-item" data-view="lots">
          <i class="fas fa-pallet"></i>
          <span>Lots d'achat</span>
        </a>

        <a class="sidebar-item" data-view="movements">
          <i class="fas fa-arrow-right-arrow-left"></i>
          <span>Mouvements</span>
        </a>

        <div class="sidebar-section-label">Catalogue</div>

        <a class="sidebar-item" data-view="promotions">
          <i class="fas fa-tags"></i>
          <span>Promotions</span>
        </a>

        <a class="sidebar-item" data-view="reviews">
          <i class="fas fa-star"></i>
          <span>Avis clients</span>
        </a>

        <a class="sidebar-item" data-view="notifications">
          <i class="fas fa-bell"></i>
          <span>Notifications</span>
          <span class="sidebar-badge info" id="notif-sidebar-badge">0</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar" data-user-initials>RB</div>
          <div>
            <div class="sidebar-user-name" data-user-name>Rabbit</div>
            <div class="sidebar-user-role" data-user-role>Administrateur</div>
          </div>
          <button class="sidebar-logout" id="logout-btn" title="Déconnexion">
            <i class="fas fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </aside>

    <main class="dash-main">
      <header class="topbar">
        <div>
          <div class="topbar-title" id="topbar-title">Tableau de bord</div>
          <div id="topbar-sub" style="font-size:11px;color:var(--text-3)"></div>
        </div>

        <div class="topbar-search">
          <i class="fas fa-magnifying-glass"></i>
          <input type="text" placeholder="Recherche globale..." />
        </div>

        <div class="topbar-actions">
          <button class="topbar-icon-btn">
            <i class="fas fa-bell"></i>
            <span class="notif-dot"></span>
          </button>
          <div class="topbar-avatar" data-user-initials>RB</div>
        </div>
      </header>

      <section class="dash-content">
        <section id="view-dashboard" class="view active"></section>
        <section id="view-products" class="view"></section>
        <section id="view-inventory" class="view"></section>
        <section id="view-intelligence" class="view"></section>
        <section id="view-rfqs" class="view"></section>
        <section id="view-lots" class="view"></section>
        <section id="view-promotions" class="view"></section>
        <section id="view-reviews" class="view"></section>
        <section id="view-notifications" class="view"></section>
        <section id="view-movements" class="view"></section>
      </section>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/labels.js"></script>
  <script src="../js/formatters.js"></script>
  <script src="../js/services.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/router.js"></script>
  <script src="../js/pages-owner.js"></script>
  <script src="../js/chatbot.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const user = await checkAuth("owner");
      if (!user) return;

      seedUserDisplay(user);

      document.getElementById("logout-btn")?.addEventListener("click", logout);

      Router.register("dashboard", {
        title: L.page.dashboard.title,
        sub: L.page.dashboard.sub,
        onEnter: DashboardPage.init,
      });

      Router.register("products", {
        title: L.page.products.title,
        sub: L.page.products.sub,
        onEnter: ProductsPage.init,
      });

      Router.register("inventory", {
        title: L.page.inventory.title,
        sub: L.page.inventory.sub,
        onEnter: InventoryPage.init,
      });

      Router.register("intelligence", {
        title: L.page.intelligence.title,
        sub: L.page.intelligence.sub,
        onEnter: IntelligencePage.init,
      });

      Router.register("rfqs", {
        title: L.page.rfqs.title,
        sub: L.page.rfqs.sub,
        onEnter: RfqsPage.init,
      });

      Router.register("lots", {
        title: L.page.lots.title,
        sub: L.page.lots.sub,
        onEnter: LotsPage.init,
      });

      Router.register("promotions", {
        title: L.page.promotions.title,
        sub: L.page.promotions.sub,
        onEnter: PromotionsPage.init,
      });

      Router.register("reviews", {
        title: L.page.reviews.title,
        sub: L.page.reviews.sub,
        onEnter: ReviewsPage.init,
      });

      Router.register("notifications", {
        title: L.page.notifications.title,
        sub: L.page.notifications.sub,
        onEnter: NotificationsPage.init,
      });

      Router.register("movements", {
        title: L.page.movements.title,
        sub: L.page.movements.sub,
        onEnter: MovementsPage.init,
      });

      Router.bindSidebar();
      Router.init();
      
      window.ProductPanel = window.ProductPanel || {
      open(id) {
        showToast("Panneau produit à connecter. ID: " + id, "warn");
      }
    };

    window.MovementsPanel = window.MovementsPanel || {
      open(id) {
        showToast("Panneau mouvements à connecter. ID: " + id, "warn");
      }
    };

    window.RfqPanel = window.RfqPanel || {
      open(id) {
        showToast("Panneau RFQ à connecter. ID: " + id, "warn");
      }
    };

    window.LotPanel = window.LotPanel || {
      open(id) {
        showToast("Panneau lot d'achat à connecter. ID: " + id, "warn");
      }
    };

      Chatbot.mount([
        { label: L.chatbot.quickHelp, message: "help" },
        { label: L.chatbot.quickInventory, message: "which items are low?" },
        { label: L.chatbot.quickReorder, message: "what should I reorder?" },
        { label: L.chatbot.quickCatalogue, message: "what products are available?" },
      ]);
    });
  </script>
</body>
</html>
